name: ci

# Pull-request CI never selects the authorized-live lane. H0, H1, and P0 are
# separate positive selections so a marker mistake cannot silently broaden a job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    env:
      QUARRY_PRIMARY_LANE: H0-hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        shard: ["0", "1", "2", "3", "4", "5"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and gate dependencies
        run: python -m pip install ".[dev,ci]"
      - name: Fatal Python lint rules
        run: ruff check src tests scripts --select E9,F63,F7,F82
      - name: Typed release boundaries
        run: >-
          mypy --no-incremental --follow-imports=skip
          src/quarry_recon/report_truth.py
          src/quarry_recon/release_v310_05.py
          src/quarry_recon/release_v310_08.py
          src/quarry_recon/repository_identity.py
      - name: Reviewed high-severity static findings
        run: python scripts/check_security_exceptions.py
      - name: No new tracked secrets
        run: |
          set -o pipefail
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --no-verify
      - name: Repository whitespace hygiene
        run: git diff --check
      - name: H0 tests (deny guard)
        env:
          QUARRY_OFFLINE_CI: "1"
        run: >-
          pytest -m offline
          --quarry-shard-count 6 --quarry-shard-index "${{ matrix.shard }}"
          --quarry-taxonomy-manifest "$RUNNER_TEMP/quarry-taxonomy.json"
          --quarry-h0-shard-report "$RUNNER_TEMP/h0-shard-${{ matrix.python-version }}-${{ matrix.shard }}.json"
      - name: Upload H0 shard outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h0-shard-outcome-${{ matrix.python-version }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/h0-shard-${{ matrix.python-version }}-${{ matrix.shard }}.json
            ${{ runner.temp }}/quarry-taxonomy.json
          if-no-files-found: error

  integration:
    env:
      QUARRY_PRIMARY_LANE: H1-tool-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install H1 system capabilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap iproute2
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: H1 synthetic tool integration
        run: pytest -m integration -ra --quarry-taxonomy-manifest "$RUNNER_TEMP/quarry-taxonomy.json"

  package:
    env:
      QUARRY_PRIMARY_LANE: P0-package-supply
      SOURCE_DATE_EPOCH: "1723680000"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package gate dependencies
        run: python -m pip install ".[dev,ci]"
      - name: Build clean candidate worktrees twice and retain combined logs
        run: |
          test -z "$(git status --porcelain)"
          candidate_commit="$(git rev-parse HEAD)"
          for build_name in a b; do
            build_root="$RUNNER_TEMP/quarry-build-$build_name"
            git worktree add --detach "$build_root" "$candidate_commit"
            test -z "$(git -C "$build_root" status --porcelain)"
            (
              cd "$build_root"
              python -m build --sdist --wheel --outdir dist
            ) >"$RUNNER_TEMP/quarry-build-$build_name.log" 2>&1
            test -s "$RUNNER_TEMP/quarry-build-$build_name.log"
            test "$(wc -c < "$RUNNER_TEMP/quarry-build-$build_name.log")" -le 65536
            git -C "$build_root" diff --exit-code
            test -z "$(git -C "$build_root" status --porcelain --untracked-files=no)"
          done
          test -z "$(git status --porcelain)"
      - name: Upload bounded clean-build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-logs-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/quarry-build-a.log
            ${{ runner.temp }}/quarry-build-b.log
          if-no-files-found: error
      - name: Compare candidate builds
        run: >-
          python scripts/compare_builds.py
          "$RUNNER_TEMP/quarry-build-a/dist" "$RUNNER_TEMP/quarry-build-b/dist"
      - name: Validate package metadata
        run: python -m twine check "$RUNNER_TEMP"/quarry-build-a/dist/*
      - name: Install and smoke the candidate wheel in a disposable prefix
        run: |
          install_prefix="$RUNNER_TEMP/quarry-install-prefix"
          invocation_cwd="$RUNNER_TEMP/quarry-install-cwd"
          wheels=("$RUNNER_TEMP"/quarry-build-a/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          expected_version="$(WHEEL="$wheel" python -c 'import os, zipfile; from email import message_from_bytes; archive=zipfile.ZipFile(os.environ["WHEEL"]); metadata=[name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]; assert len(metadata) == 1; version=message_from_bytes(archive.read(metadata[0]))["Version"]; assert version; print(version)')"
          mkdir -p "$invocation_cwd"
          python -m venv "$install_prefix"
          "$install_prefix/bin/python" -m pip install --force-reinstall --no-compile \
            "$wheel"
          (
            cd "$invocation_cwd"
            CHECKOUT_ROOT="$GITHUB_WORKSPACE" INSTALL_PREFIX="$install_prefix" EXPECTED_VERSION="$expected_version" \
              env -u PYTHONPATH "$install_prefix/bin/python" -c 'import importlib.resources as r, os, pathlib, quarry_recon, sys; checkout=pathlib.Path(os.environ["CHECKOUT_ROOT"]).resolve(); prefix=pathlib.Path(os.environ["INSTALL_PREFIX"]).resolve(); under=lambda path: path.resolve().is_relative_to(prefix); assert quarry_recon.__version__ == os.environ["EXPECTED_VERSION"]; assert under(pathlib.Path(quarry_recon.__file__)); resource=pathlib.Path(r.files("quarry_recon").joinpath("data/target.template.yaml")); assert resource.is_file() and under(resource); cli=prefix / "bin" / "quarry"; assert cli.is_file() and under(cli); assert all((entry_path := pathlib.Path(entry or ".").resolve()) != checkout and checkout not in entry_path.parents for entry in sys.path)'
            env -u PYTHONPATH "$install_prefix/bin/quarry" --help >/dev/null
          )
      - name: Audit declared dependencies and emit dependency SBOM
        run: >-
          pip-audit --strict . --format cyclonedx-json
          --output "$RUNNER_TEMP/quarry-dependencies.cdx.json"
      - name: P0 package and supply tests
        env:
          QUARRY_DEPENDENCY_SBOM: ${{ runner.temp }}/quarry-dependencies.cdx.json
          QUARRY_PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/quarry-build-a/dist
          QUARRY_PACKAGE_INSTALL_PREFIX: ${{ runner.temp }}/quarry-install-prefix
        run: pytest -m packaging --quarry-taxonomy-manifest "$RUNNER_TEMP/quarry-taxonomy.json"
