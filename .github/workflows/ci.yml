name: offline-ci

# Current development CI: positively selects the structurally complete H0 lane and arms the Python-level
# deny guard. This is not yet the OS isolation or canonical machine evidence required by
# docs/releases/RELEASE-GATES.md. H1/C0/P0/L0 lanes are deliberately separate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    env:
      QUARRY_PRIMARY_LANE: H0-hermetic
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (package + dev)
        run: pip install -e ".[dev]"
      - name: H0 tests (deny guard)
        env:
          QUARRY_OFFLINE_CI: "1"     # arms the session-wide guard (covers import-time network too)
        run: pytest -m offline --quarry-taxonomy-manifest "$RUNNER_TEMP/quarry-taxonomy.json"
