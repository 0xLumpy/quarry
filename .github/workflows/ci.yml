name: offline-ci

# Current development CI: positively selects tests marked `offline` and arms the Python-level deny guard.
# This does not yet classify every non-live test or provide the OS isolation/machine evidence required by
# docs/releases/RELEASE-GATES.md. Integration/live suites are deliberately excluded here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (package + dev)
        run: pip install -e ".[dev]"
      - name: Offline-marked tests (deny guard)
        env:
          QUARRY_OFFLINE_CI: "1"     # arms the session-wide guard (covers import-time network too)
        run: pytest -m offline
