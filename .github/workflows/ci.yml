name: ci

# Pull-request CI never selects the authorized-live lane. H0, H1, and P0 are
# separate positive selections so a marker mistake cannot silently broaden a job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    env:
      QUARRY_PRIMARY_LANE: H0-hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and gate dependencies
        run: python -m pip install ".[dev,ci]"
      - name: Fatal Python lint rules
        run: ruff check src tests scripts --select E9,F63,F7,F82
      - name: Typed release boundaries
        run: >-
          mypy --no-incremental --follow-imports=skip
          src/quarry_recon/report_truth.py
          src/quarry_recon/release_v310_05.py
          src/quarry_recon/release_v310_08.py
          src/quarry_recon/repository_identity.py
      - name: Repository whitespace hygiene
        run: git diff --check
      - name: H0 tests (deny guard)
        env:
          QUARRY_OFFLINE_CI: "1"
        run: pytest -m offline

  integration:
    env:
      QUARRY_PRIMARY_LANE: H1-tool-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install H1 system capabilities
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap iproute2
      - name: Install test dependencies
        run: python -m pip install ".[dev]"
      - name: H1 synthetic tool integration
        run: pytest -m integration -ra

  package:
    env:
      QUARRY_PRIMARY_LANE: P0-package-supply
      SOURCE_DATE_EPOCH: "1723680000"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package gate dependencies
        run: python -m pip install ".[dev,ci]"
      - name: Build clean candidate worktrees twice and retain combined logs
        run: |
          test -z "$(git status --porcelain)"
          candidate_commit="$(git rev-parse HEAD)"
          for build_name in a b; do
            build_root="$RUNNER_TEMP/quarry-build-$build_name"
            git worktree add --detach "$build_root" "$candidate_commit"
            test -z "$(git -C "$build_root" status --porcelain)"
            (
              cd "$build_root"
              python -m build --sdist --wheel --outdir dist
            ) 2>&1 | sed -E '/^(copying|adding|creating|removing) /d' \
              >"$RUNNER_TEMP/quarry-build-$build_name.log"
            test -s "$RUNNER_TEMP/quarry-build-$build_name.log"
            test "$(wc -c < "$RUNNER_TEMP/quarry-build-$build_name.log")" -le 65536
            git -C "$build_root" diff --exit-code
            test -z "$(git -C "$build_root" status --porcelain --untracked-files=no)"
          done
          test -z "$(git status --porcelain)"
      - name: Upload bounded clean-build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-logs-3.12
          path: |
            ${{ runner.temp }}/quarry-build-a.log
            ${{ runner.temp }}/quarry-build-b.log
          if-no-files-found: error
      - name: Compare candidate builds
        run: >-
          python scripts/compare_builds.py
          "$RUNNER_TEMP/quarry-build-a/dist" "$RUNNER_TEMP/quarry-build-b/dist"
      - name: Validate package metadata
        run: python -m twine check "$RUNNER_TEMP"/quarry-build-a/dist/*
      - name: Install and smoke the candidate wheel in a disposable prefix
        run: |
          install_prefix="$RUNNER_TEMP/quarry-install-prefix"
          invocation_cwd="$RUNNER_TEMP/quarry-install-cwd"
          wheels=("$RUNNER_TEMP"/quarry-build-a/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          expected_version="$(WHEEL="$wheel" python -c 'import os, zipfile; from email import message_from_bytes; archive=zipfile.ZipFile(os.environ["WHEEL"]); metadata=[name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]; assert len(metadata) == 1; version=message_from_bytes(archive.read(metadata[0]))["Version"]; assert version; print(version)')"
          mkdir -p "$invocation_cwd"
          python -m venv "$install_prefix"
          "$install_prefix/bin/python" -m pip install --force-reinstall --no-compile \
            "$wheel"
          (
            cd "$invocation_cwd"
            CHECKOUT_ROOT="$GITHUB_WORKSPACE" INSTALL_PREFIX="$install_prefix" EXPECTED_VERSION="$expected_version" \
              env -u PYTHONPATH "$install_prefix/bin/python" -c 'import importlib.resources as r, os, pathlib, quarry_recon, sys; checkout=pathlib.Path(os.environ["CHECKOUT_ROOT"]).resolve(); prefix=pathlib.Path(os.environ["INSTALL_PREFIX"]).resolve(); under=lambda path: path.resolve().is_relative_to(prefix); assert quarry_recon.__version__ == os.environ["EXPECTED_VERSION"]; assert under(pathlib.Path(quarry_recon.__file__)); resource=pathlib.Path(r.files("quarry_recon").joinpath("data/target.template.yaml")); assert resource.is_file() and under(resource); schema=prefix / "share" / "quarry-recon" / "schemas" / "release-scope-v1.schema.json"; assert schema.is_file() and under(schema); cli=prefix / "bin" / "quarry"; assert cli.is_file() and under(cli); assert all((entry_path := pathlib.Path(entry or ".").resolve()) != checkout and checkout not in entry_path.parents for entry in sys.path)'
            env -u PYTHONPATH "$install_prefix/bin/quarry" --help >/dev/null
          )
      - name: Observe installed runtime C-SBOM closure
        run: |
          install_prefix="$RUNNER_TEMP/quarry-install-prefix"
          wheels=("$RUNNER_TEMP"/quarry-build-a/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          env -u PYTHONPATH "$install_prefix/bin/python" scripts/emit_sbom_observation.py \
            --wheel "${wheels[0]}" \
            --output "$RUNNER_TEMP/sbom-observation-3.12.json"
      - name: Upload raw C-SBOM observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-observation-3.12
          path: ${{ runner.temp }}/sbom-observation-3.12.json
          if-no-files-found: error
      - name: Audit the exact resolved C-SBOM dependency closure once
        run: |
          pins="$RUNNER_TEMP/vulnerability-requirements-3.12.txt"
          raw="$RUNNER_TEMP/quarry-dependencies.cdx.json"
          stderr="$RUNNER_TEMP/pip-audit-3.12.stderr"
          python scripts/emit_vulnerability_requirements.py \
            --observation "$RUNNER_TEMP/sbom-observation-3.12.json" \
            --output "$pins"
          scan_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          pip-audit --strict --no-deps --disable-pip -r /dev/stdin --format cyclonedx-json --progress-spinner off <"$pins" >"$raw" 2>"$stderr"
          scan_status=$?
          set -e
          scan_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PINS="$pins" RAW="$raw" STDERR="$stderr" STATUS="$scan_status" STARTED_AT="$scan_started_at" FINISHED_AT="$scan_finished_at" OUTPUT="$RUNNER_TEMP/vulnerability-observation-3.12.json" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          raw = Path(os.environ["RAW"]).read_bytes()
          stderr = Path(os.environ["STDERR"]).read_bytes()
          requirements = Path(os.environ["PINS"]).read_bytes()
          if len(raw) > 512 * 1024 or len(stderr) > 64 * 1024 or len(requirements) > 64 * 1024:
              raise SystemExit("bounded vulnerability observation input exceeded")
          document = {
              "artifact_type": "vulnerability-observation",
              "exit_status": int(os.environ["STATUS"]),
              "finished_at": os.environ["FINISHED_AT"],
              "requirements": "base64:" + base64.b64encode(requirements).decode("ascii"),
              "scanner": {"argv": ["pip-audit", "--strict", "--no-deps", "--disable-pip", "-r", "/dev/stdin", "--format", "cyclonedx-json", "--progress-spinner", "off"], "name": "pip-audit", "version": "2.10.1"},
              "schema_version": "quarry.vulnerability-observation.v1",
              "started_at": os.environ["STARTED_AT"],
              "stderr": "base64:" + base64.b64encode(stderr).decode("ascii"),
              "stdout": "base64:" + base64.b64encode(raw).decode("ascii"),
              "subject": {"kind": "resolved-sbom-closure", "requirements_digest": "sha256:" + __import__("hashlib").sha256(requirements).hexdigest(), "sbom_observation": "sbom-observation-3.12"},
          }
          Path(os.environ["OUTPUT"]).write_text(json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          if Path(os.environ["OUTPUT"]).stat().st_size > 1024 * 1024:
              raise SystemExit("bounded vulnerability observation output exceeded")
          PY
      - name: Upload raw C-VULNERABILITY observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-observation-3.12
          path: ${{ runner.temp }}/vulnerability-observation-3.12.json
          if-no-files-found: error
      - name: P0 package and supply tests
        env:
          QUARRY_DEPENDENCY_SBOM: ${{ runner.temp }}/quarry-dependencies.cdx.json
          QUARRY_PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/quarry-build-a/dist
          QUARRY_PACKAGE_INSTALL_PREFIX: ${{ runner.temp }}/quarry-install-prefix
        run: pytest -m packaging
      - name: Enforce the retained pip-audit result without rerunning it
        if: ${{ always() }}
        run: >-
          OBSERVATION="$RUNNER_TEMP/vulnerability-observation-3.12.json"
          python -c 'import json, os, pathlib; document=json.loads(pathlib.Path(os.environ["OBSERVATION"]).read_text(encoding="utf-8")); status=document.get("exit_status"); raise SystemExit(0 if type(status) is int and status == 0 else "retained pip-audit status is nonzero or malformed")'
