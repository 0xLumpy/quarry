[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-recon"
version = "0.3.9"
description = "Quarry — methodology-driven reconnaissance automation framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xlumpy" }]
dependencies = [
    "click>=8.2",
    "pyyaml>=6.0",
    "idna>=3.4",                 # IDNA2008/UTS-46 domain canonicalization (correct target identity)
    "tomli>=2.0; python_version < '3.11'",  # semantic release-candidate metadata parsing on Python 3.10
]

[project.urls]
Homepage = "https://github.com/0xLumpy/quarry"
Issues = "https://github.com/0xLumpy/quarry/issues"
Security = "https://github.com/0xLumpy/quarry/security/policy"

[project.scripts]
quarry = "quarry_recon.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.23"]
ci = [
    "bandit==1.9.4",
    "build==1.5.0",
    "detect-secrets==1.5.0",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "ruff==0.16.3",
    "twine==7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry_recon = ["data/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
# Every collected test is assigned one primary lane by tests/conftest.py before
# marker selection.  The Python-level deny guard remains a development tripwire,
# not the OS isolation boundary required by the release-gate contract.
testpaths = ["tests"]
markers = [
    "offline: H0 hermetic lane — no network or undeclared external binary",
    "integration: H1 tool-integration lane — attested real binary against synthetic fixtures",
    "corpus: C0 private-corpus lane",
    "packaging: P0 package-supply lane",
    "live: contacts the live range/network (never in offline CI)",
    "requires_tool(name): secondary capability annotation naming one real tool",
    "synthetic_process: secondary H0 annotation permitting a controlled interpreter/synthetic child",
]
# Default development and CI selection is the positively classified H0 lane.
# OS isolation and canonical machine evidence remain open release prerequisites.
addopts = "--strict-markers -ra -m offline"
