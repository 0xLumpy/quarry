[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-recon"
version = "0.3.9"
description = "Quarry — methodology-driven reconnaissance automation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xlumpy" }]
dependencies = [
    "click>=8.2",
    "pyyaml>=6.0",
    "idna>=3.4",                 # IDNA2008/UTS-46 domain canonicalization (correct target identity)
    "tomli>=2.0; python_version < '3.11'",  # semantic release-candidate metadata parsing on Python 3.10
]

[project.scripts]
quarry = "quarry_recon.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry_recon = ["data/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
# Default selection excludes live/integration/tool tests. The conftest Python-level deny guard is a
# development tripwire for the remaining tests; it is not the OS isolation boundary required by the
# release-gate contract. CI currently selects `-m "offline"`.
testpaths = ["tests"]
markers = [
    "offline: intended hermetic lane — no network or external binary (current CI selection)",
    "requires_tool: needs a real external binary on PATH (skips when absent)",
    "integration: runs a real external binary against fixtures (no live target)",
    "live: contacts the live range/network (never in offline CI)",
]
# Default run excludes live/integration/requires_tool; explicit marker selection opts into them. Complete
# lane classification and OS isolation remain open release prerequisites.
addopts = "--strict-markers -ra -m 'not live and not integration and not requires_tool'"
