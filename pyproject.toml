[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-recon"
version = "0.3.5"
description = "Quarry — methodology-driven reconnaissance automation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xlumpy" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
quarry = "quarry_recon.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry_recon = ["data/*.yaml", "data/*.txt"]
