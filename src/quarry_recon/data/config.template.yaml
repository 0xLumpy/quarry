# Quarry — non-secret runtime config (~/.config/quarry/config.yaml).
#
# Machine-scoped knobs that are NOT credentials and NOT per-engagement. secrets.yaml stays
# credentials-only; target.yaml stays the engagement (scope + RATELIMIT). Everything here is
# optional — unset = safe defaults. Created once; `quarry install` never overwrites it.

# ── Performance / concurrency ────────────────────────────────────────────────────────────────
# CONCURRENCY = how many LOCAL lanes a tool uses (a machine property). This is separate from RATE
# (pressure on the TARGET) — RATE stays in target.yaml → RATELIMIT. Pushing concurrency must NOT
# push past the target's rate budget; the two are tuned independently.
PERFORMANCE:
  PROFILE: auto        # auto (scale workers from CPU cores) | safe | balanced | aggressive
  # auto/balanced/aggressive only ADD lanes on bigger boxes — they never drop below the tool's
  # proven default, so a small VPS keeps the old behavior. Only `safe` throttles below defaults.
  # optional explicit per-tool overrides (blank = profile / tool default):
  NUCLEI_CONCURRENCY:
  HTTPX_THREADS:
  FFUF_THREADS:
  DALFOX_WORKERS:            # dalfox v3 --workers, per-target concurrency for the XSS fast path (default 30)
  KATANA_CONCURRENCY:        # katana crawl -c (network-bound; was hard-coded 4 → now I/O-scaled)
  KATANA_PARALLELISM:        # katana -p, parallel hosts (default 10; was 3)
  ARJUN_THREADS:             # arjun -t (was hard-coded 5 → now I/O-scaled)
  NUCLEI_BULK_SIZE:          # nuclei -bs, hosts per template batch (default 25) — raise for many-host scopes
  NUCLEI_CHUNK_HOSTS:        # nuclei hosts per resumable batch (default 50; smaller = finer resume/progress, more template reloads)
  NUCLEI_MAX_HOST_ERROR:     # nuclei -mhe, errors per host before it is SKIPPED. DEFAULT 0 = full depth (-nmhe, never drop an erroring host) — Quarry is coverage-first. A nonzero value is an explicitly bounded coverage policy (nuclei-native default would be 30) and costs coverage to save time. Changing it invalidates nuclei resume state
  SUBFINDER_MAX_TIME:        # subfinder -max-time budget in MINUTES per apex (default 60). Reaching it = PARTIAL (capped, results kept); 0 = practically unbounded (24h) — run to completion
  # Fetch-lane THROUGHPUT budgets in SECONDS. DEFAULT 0 = UNBOUNDED: process the whole eligible set. These
  # replaced the old first-N input caps (JS 2000, sourcemaps 100), which silently dropped input and picked
  # WHICH input by discovery order. Work is now host-round-robin ordered, and whatever a budget does not
  # reach is a counted, RESUMABLE remainder — never a silent omission. Bound these only to time-box a run.
  JS_FETCH_BUDGET_S:         # crawl JS download lane (was: cap 2000 of eligible JS URLs)
  SOURCEMAP_BUDGET_S:        # crawl .map fetch lane (was: cap 100 of referenced sourcemaps)
  CONTENT_FFUF_BUDGET_S:     # content discovery lane (was: cap 25 of eligible live services)
  VHOST_BUDGET_S:            # vhost enumeration lane (was: cap 25 origins; membership is now base services)
  ARJUN_BUDGET_S:            # arjun param discovery (was: cap 40 of eligible API endpoints). ONE TARGET PER
                             # PROCESS: arjun crashes on a 400/413/418/429/503 target and a batched run loses
                             # every target after it, so isolation is coverage
  SHODAN_CREDIT_RESERVE:     # query credits this run will NOT spend, kept back for manual work (default 0
                             # = spend everything available). Shodan meters query credits MONTHLY. Among
                             # QUARRY'S CURRENT Shodan calls only /shodan/host/search consumes them —
                             # /api-info, /shodan/host/count and /shodan/host/{ip} are free and keep
                             # working at a zero balance (measured). Other Shodan endpoints DO charge
                             # (e.g. /dns/domain/{domain}); re-check when a new call is added.
                             # Exhaustion is an expected boundary, not an error: the run reports
                             # complete_with_limits and persists the unqueried pivots as a resumable
                             # remainder. NB if this is set but UNPARSEABLE, Quarry issues NO paid search
                             # rather than silently spending — a broken cost guard must not read as none
  ARJUN_TARGETS:             # concurrent arjun TARGET processes (default 5; at most one per host). RATE is
                             # separate: RATELIMIT.HTTP is a GLOBAL lane cap partitioned across these workers
                             # (never handed to each in full), and a rate below the pool size shrinks the POOL
  DALFOX_TARGETS:            # dalfox v3 --max-concurrent-targets, target parallelism (default 4; conservative — raise via OTC)
  DALFOX_CHUNK:              # dalfox xss candidate shapes per resumable batch (default 40)
  # v0.3.5 web-port SYN prefilter: before the bulk httpx, naabu SYN-checks each host's PUBLIC IP(s) on
  # the HTTP port set and httpx then probes ONLY open host:ports (bbot-style — never wastes httpx time
  # on filtered ports). Fewer packets + fewer HTTP requests than direct httpx over all ports. Default on;
  # falls back to direct httpx if naabu is missing/fails. NOT the infra portscan (MODES.PORTSCAN).
  WEB_PORT_PREFILTER: true   # false = direct-httpx over ALL ports, no SYN prefilter (debugging).
                             # the private/reserved-only-host SKIP still applies either way (safety rail).

# ── Advanced local tool paths (NOT credentials — paths, so they live here, not in secrets.yaml) ──
# openintel-subs: extra PASSIVE subdomain source, silently unused unless BOTH paths are set AND
# present. You provide the binary + local subs.db. See notes/OPENINTEL-OPTIONAL.md.
# (Legacy: an `openintel:` block in secrets.yaml is still read for back-compat, but config.yaml is
#  its proper home — this is a path pair, not a credential.)
# openintel:
#   binary: /opt/openintel-subs/openintel-subs-linux
#   db:     /opt/openintel-subs/subs.db
