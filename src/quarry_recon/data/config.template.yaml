# Quarry — machine settings (~/.config/quarry/config.yaml). Reference: README "Configuration".
# Everything is optional; blank means the default. Engagement settings (scope, rate limits, modes)
# belong in the project's target.yaml, not here.
#
# Concurrency is how many local lanes a tool uses. Rate — how hard the target is hit — is an
# engagement property and lives in target.yaml under RATELIMIT.

PERFORMANCE:
  PROFILE: auto              # auto | safe | balanced | aggressive. Only `safe` goes below a
                             # tool's own default; the others add lanes on bigger hosts.

  # Per-tool concurrency. Blank: scaled from CPU count under the profile.
  NUCLEI_CONCURRENCY:
  HTTPX_THREADS:
  FFUF_THREADS:
  KATANA_CONCURRENCY:
  ARJUN_THREADS:
  DALFOX_WORKERS:            # per target (default 30)

  # Batch and parallelism shapes.
  KATANA_PARALLELISM:        # parallel hosts (default 10)
  NUCLEI_BULK_SIZE:          # hosts per template batch (default 25)
  NUCLEI_CHUNK_HOSTS:        # hosts per resumable batch (default 50)
  ARJUN_TARGETS:             # concurrent target processes, max one per host (default 5)
  DALFOX_TARGETS:            # concurrent targets (default 4)
  DALFOX_CHUNK:              # candidates per resumable batch (default 40)

  # Coverage policy. `quarry policy` prints the effective values.
  NUCLEI_MAX_HOST_ERROR:     # errors before a host is dropped (default 0 = never drop).
                             # Changing this invalidates nuclei resume state.
  SUBFINDER_MAX_TIME:        # minutes per apex (default 60; 0 = the 1440-minute maximum).
                             # Reaching it is reported as partial, not as success.
  WILDCARD_ZONES_PER_RUN:    # wildcard zones differentiated per run (default 5)

  # Throughput budgets in SECONDS. 0 = unbounded, and unbounded is the default: these bound how
  # long a lane runs, never which input is eligible. Whatever a budget does not reach is counted
  # and resumable. Set one only to time-box a run.
  JS_FETCH_BUDGET_S:
  SOURCEMAP_BUDGET_S:
  CONTENT_FFUF_BUDGET_S:
  VHOST_BUDGET_S:
  ARJUN_BUDGET_S:
  A1D_BUDGET_S:
  WILDCARD_BUDGET_S:
  SHODAN_HOST_BUDGET_S:      # the free per-IP lane; costs no credit, so only time bounds it

  # Acquisition byte ceilings. 0 = unbounded, the default: paid/hostile evidence is kept WHOLE. The
  # always-on host guard is the free-space reserve — an acquisition stops before the artifact
  # filesystem falls below it, keeps the partial, and records a typed truncation.
  ACQUIRE_RESPONSE_MAX_BYTES:  # per single response (default 0 = unbounded)
  ACQUIRE_RUN_MAX_BYTES:       # cumulative acquired bytes this run (default 0 = unbounded)
  ACQUIRE_PROJECT_MAX_BYTES:   # cumulative across the project (default 0 = unbounded)
  ACQUIRE_FREE_RESERVE_BYTES:  # keep at least this free on the artifact fs (default 1 GiB)

  # Provider spending. Reserves are credits a run will NOT touch. An unparseable value here issues
  # no paid request at all, rather than spending.
  SHODAN_CREDIT_RESERVE:     # query credits held back (default 0 = spend what is available)
  SHODAN_MAX_PAGES:          # pages per pivot (0 = until exhausted; the credit balance is the bound)
  SHODAN_PAGE_TTL_DAYS:      # how long a purchased page substitutes for a fresh one (default 7).
                             # Past it the page is kept as history and is never re-bought silently.
  WHOXY_CREDIT_RESERVE:      # reverse-whois credits held back. Whoxy charges one credit per PAGE
  WHOXY_PAGE_BUDGET:         # pages this run may buy (default 0 = unbounded)
  PROVIDER_MAX_PAGES:        # cursor pages per free provider request (default 5)

  WEB_PORT_PREFILTER: true   # SYN-check each host's public IPs before httpx, and probe only open
                             # ports. false sends httpx at every port. Not the infra port scan.

# openintel-subs: an extra passive subdomain source. Both paths must exist or it stays unused.
# openintel:
#   binary: /opt/openintel-subs/openintel-subs-linux
#   db:     /opt/openintel-subs/subs.db
