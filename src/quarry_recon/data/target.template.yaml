# Quarry target profile — one per engagement. Empty sections skip cleanly.
# Reference: docs/target-prep.md

TARGET: example

# In-scope apex roots. Discovery is anchored here (suffix match).
APEX_DOMAINS:
  - example.com

# Out-of-scope patterns (regex against the full host). Collected passively, never contacted.
# Add from the CLI: quarry oos -t <project> <host|regex>
OOS:
  # - '^jobs\.'

# In-scope IP ranges. Empty: no range expansion and no infra port scan.
CIDR:
  # - 192.0.2.0/24

# ASN seeds. Context only — active range scanning still needs CIDR.
ASN:
  # - AS12345

# Organisation names anchor `quarry osint`; both fields seed cloud-bucket
# candidates during active recon.
ORG_NAMES:
  # - Example Inc
BRANDS:
  # - Example

# Pressure on the target. Empty: each tool's own default.
# Set only when the program's rules of engagement cap you.
RATELIMIT:
  HTTP:                 # req/s for httpx, katana, nuclei, dalfox
  DNS:                  # qps for puredns, massdns
  PORTSCAN:             # naabu packet rate

# HTTP probe ports. Empty: the full methodology set.
PORTS:
  HTTP:

LIMITS:
  WAYMORE_RESPONSES: 5000     # archived responses per apex (0 = all, heavy)

MODES:
  PASSIVE_ONLY: false         # no active probing or scanning at all
  HEADLESS: false             # katana headless SPA crawl (RAM-heavy)
  SCREENSHOTS: true
  TAKEOVER: true              # collect CNAMEs, run takeover templates
  PORTSCAN: false             # infra scan (naabu top-1000 -> nmap): needs true AND CIDR.
                              # The web-port SYN prefilter runs separately during active
                              # recon when naabu is available.
  BLOCK_PRIVATE_TARGETS: false  # false: in-scope names resolving to private, CGNAT or ULA
                              # addresses are contacted and recorded as leads. The scan host
                              # itself and cloud metadata are always withheld.
  CONTENT_DISCOVERY: "off"    # off | light | balanced | deep
  CONTENT_RECURSION: 0        # depth for balanced/deep
  JS_AST: false               # AST analysis of downloaded JS bundles (local, memory-hungry)

  # The options below add active or credential-using work. Arm them per engagement.
  SECRET_VERIFICATION: false  # sends discovered TARGET credentials to their providers
  BLIND_XSS: false            # stored payload; can fire later in someone else's browser
  DEEP_EVIDENCE: false        # downloads heapdumps and similar (the GET forces generation)
  JS_CHUNK_BRUTE: 0           # guessed chunk ids; each guess requests a path no bundle named

# Free-form engagement notes, recorded in the run manifest.
NOTES:
  # - Add any context you want to preserve with the run.
