# Quarry — Target Profile
# Compiles into the scope matchers used by every phase. Empty sections skip cleanly.
# Edit this file per engagement. NEVER commit API keys here — keys live in tool configs.

TARGET: example

# In-scope APEX roots. Vertical discovery is anchored to these (suffix match).
APEX_DOMAINS:
  - example.com

# Out-of-scope patterns (regex, matched against full host). Collected passively, never actively scanned.
# Add with `quarry oos -t <project> <host|regex>…`, or uncomment/edit the examples below.
OOS:
  # - '^jobs\.'
  # - '^careers\.'

# In-scope IP ranges. If empty, horizontal IP/port scanning is SKIPPED.
CIDR:
  # - 192.0.2.0/24

# Manual ASN seeds. If empty, ASN discovery only SUGGESTS candidates for review;
# active range scanning happens only for ASNs/CIDRs explicitly listed here.
ASN:
  # - AS12345

# Optional anchors for the OSINT pre-flight (`quarry osint`). Not used by the recon run.
# ORG_NAMES → whoxy reverse-whois by company (finds sibling apexes). Needs whoxy key.
# BRANDS  → reserved for future dork-based sources (parsed, not yet used).
ORG_NAMES:
  # - Example Inc
BRANDS:
  # - Example

RATELIMIT:
  # HTTP req/s for httpx/katana/nuclei/dalfox. EMPTY => tool defaults (fast — recommended).
  # Set ONLY when a program's RoE caps you: a low cap (e.g. 5) makes nuclei very slow, since
  # its work = templates x hosts (thousands of templates). Example for a 5 req/s program:
  #   HTTP: 5
  HTTP:
  # DNS qps for puredns/massdns (public resolvers — VPS only, can be high). empty => tool default.
  DNS:
  # Port-scan packet rate for naabu. empty => tool default.
  PORTSCAN:

PORTS:
  # HTTP probe ports. Empty => full methodology set.
  # Populate only to narrow or override for an engagement.
  HTTP:

LIMITS:
  # Max archived responses waymore downloads per apex (waymore -l). 0 = ALL (heavy).
  WAYMORE_RESPONSES: 5000

MODES:
  PASSIVE_ONLY: false   # true => no active probing/scanning at all (OSINT only)
  HEADLESS: false       # true => katana headless SPA crawl (RAM-heavy)
  SCREENSHOTS: true
  PORTSCAN: false       # INFRA port scan ONLY: naabu top-1000 over CIDR -> nmap -sV (the slow, weeks-long
                        # side-stream). OFF by default — set true AND provide CIDR to opt in deliberately.
                        # Does NOT control the fast web-port SYN prefilter (naabu over resolved host IPs
                        # -> httpx on open ports only): that is main-river and always on when naabu exists.
  TAKEOVER: true        # true => collect CNAMEs + run nuclei takeover templates
  BLOCK_PRIVATE_TARGETS: false  # default false: a name resolving to RFC1918/CGNAT/ULA is a LEAD — RECORDED
                        # as a finding AND contacted (offensive; evidence validates ownership). Set true for a
                        # conservative VPS-external posture (don't touch private space). The scan box itself +
                        # cloud metadata (169.254.169.254 etc) are ALWAYS withheld from contact regardless.
  SECRET_VERIFICATION: false  # default false: discovered secrets are reported UNVERIFIED. trufflehog's
                        # default verification sends found TARGET credentials to their THIRD-PARTY provider
                        # APIs (active credential use against a third party — RoE/legal concern). Discovery
                        # is unaffected either way (every secret is still found/reported). Set true only when
                        # the engagement explicitly authorizes credential verification.
  CONTENT_DISCOVERY: "off"  # off | light | balanced | deep — candidate-driven path brute (default off)
  CONTENT_RECURSION: 0    # recursion depth for content discovery (0 = off; pairs with balanced/deep)
  DEEP_EVIDENCE: false    # true => DOWNLOAD + mine heavy artifacts (actuator heapdump) instead of just
                          # flagging them. A heapdump GET triggers server-side generation — opt-in only.

# Free-text program rules for the analyst (and the run manifest).
NOTES:
  # - e.g. program caps requests at 5 req/s -> set RATELIMIT.HTTP: 5
