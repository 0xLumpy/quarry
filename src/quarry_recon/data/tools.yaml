# Quarry — Tool Registry
# Every integrated tool is documented here BEFORE it is trusted (design principle 8).
# Fields:
#   bin            executable name expected on PATH
#   phase          methodology phase that uses it
#   role           short purpose
#   install        idempotent install command (framework-managed via `quarry install`)
#   update         update command (`quarry update`); defaults to install if omitted
#   version_cmd    command to capture installed version (doctor)
#   doc            official source-of-truth reviewed
#   keys           API keys / config required for full coverage (doctor warns, never blocks)
#   optional       true => doctor reports missing as INFO not WARN
#   notes          drift / safety / failure-mode notes from the methodology + flags.md

go_env: &go "GOBIN ok; needs Go toolchain on PATH"

tools:
  # ── Phase 0: OSINT (apex/org/leak discovery) ────────────────────────────
  # Most OSINT sources are in-process HTTP/whois/dig calls needing NO tool install:
  #   azmap.dev M365 tenant, whois/RDAP registrant, DMARC pivot (dig), whoxy reverse-whois.
  # Key-gated in-process: whoxy (secrets.yaml -> whoxy:). The one installed tool:
  - bin: porch-pirate
    maintenance_state: frozen
    version: "0.0.1"
    phase: osint
    role: search public Postman workspaces for the target's API endpoints/secrets
    install: pipx install porch-pirate
    update: pipx upgrade porch-pirate
    version_cmd: porch-pirate -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    # v0.3.9: repo moved MandConsultingGroup -> WatchDogSecurity (old 301-redirects). PyPI pkg unchanged (frozen).
    doc: https://github.com/WatchDogSecurity/porch-pirate
    repo: WatchDogSecurity/porch-pirate
    runtime: pipx
    optional: true
    notes: 'No key. porch-pirate -s <domain> --urls --dump. Public Postman recon (API leaks).'

  # ── Phase 2: Horizontal discovery ───────────────────────────────────────
  - bin: asnmap
    maintenance_state: monitor
    version: "v1.1.1"
    phase: horizontal
    role: ASN -> CIDR ranges (context); echo AS123 | asnmap -silent
    install: go install github.com/projectdiscovery/asnmap/cmd/asnmap@latest
    version_cmd: asnmap -version
    doc: https://github.com/projectdiscovery/asnmap
    notes: Can hang on its data source — runner enforces hard timeout.

  - bin: mapcidr
    maintenance_state: active
    version: "v1.1.97"
    phase: horizontal
    role: expand/condense CIDR ranges to IPs
    install: go install github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest
    version_cmd: mapcidr -version
    doc: https://github.com/projectdiscovery/mapcidr

  - bin: tlsx
    maintenance_state: active
    version: "v1.2.2"
    phase: horizontal
    role: TLS SAN/CN harvest on IP ranges -> in-scope hostnames
    install: go install github.com/projectdiscovery/tlsx/cmd/tlsx@latest
    version_cmd: tlsx -version
    doc: https://github.com/projectdiscovery/tlsx
    notes: Lighter local version of Caduceus. Use -san -cn -silent -p 443.

  - bin: caduceus
    maintenance_state: frozen
    version: "v1.0.5"
    phase: horizontal
    role: ASN/CIDR -> live TLS cert scan -> real hostnames behind CDN
    install: go install github.com/g0ldencybersec/Caduceus/cmd/caduceus@latest
    version_cmd: caduceus -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/g0ldencybersec/Caduceus
    optional: true
    notes: Active cert scan. Run only on owned IP space. Full cloud sweep = 2-5 days.

  # ── Phase 3: Vertical subdomain discovery ───────────────────────────────
  - bin: shosubgo
    maintenance_state: monitor
    release: "5.0"
    version: "v0.0.0-20250901210855-ccb6dc7bf0ef"
    phase: vertical
    role: Shodan-only subdomain discovery (narrow focus = unique hits)
    install: go install github.com/incogbyte/shosubgo@latest
    version_cmd: shosubgo -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/incogbyte/shosubgo
    keys: Shodan key -> secrets.yaml (shodan:)
    optional: true

  - bin: subfinder
    maintenance_state: active
    version: "v2.14.0"
    phase: vertical
    role: passive subdomain enum (primary); subfinder -all (no -recursive — it RESTRICTS sources)
    install: go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
    version_cmd: subfinder -version
    doc: https://github.com/projectdiscovery/subfinder
    keys: ~/.config/subfinder/provider-config.yaml (chaos, github, shodan, securitytrails, netlas, c99, dnsdumpster, fofa, ...)
    notes: -all enables all sources (+20 results in testing); -recursive would RESTRICT to the recursive-capable
      subset (coverage loss, T1.2). -max-time budget = PERFORMANCE.SUBFINDER_MAX_TIME min (default 60; 0=~unbounded) — reaching it = PARTIAL (capped),
      not a clean SUCCESS (vertical.py reclassify). -stats shows per-key health.

  - bin: github-subdomains
    maintenance_state: frozen
    version: "v1.2.2"
    phase: vertical
    role: scrape GitHub for referenced subdomains (3-10% extra, unique)
    install: go install github.com/gwen001/github-subdomains@latest
    version_cmd: github-subdomains -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/gwen001/github-subdomains
    keys: GitHub PATs -> secrets.yaml (github:) — use burner accounts to dodge rate limits
    optional: true

  - bin: puredns
    maintenance_state: frozen
    version: "v2.1.1"
    phase: vertical
    role: massdns wrapper — DNS brute + validate
    install: go install github.com/d3mondev/puredns/v2@latest
    version_cmd: puredns --help
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/d3mondev/puredns
    notes: Requires massdns on host. Needs resolvers + trusted-resolvers lists.

  - bin: massdns
    maintenance_state: monitor
    release: "1.1.0"
    phase: vertical
    role: high-perf stub resolver (puredns backend)
    # C08.2b: pinned to an EXACT commit (massdns publishes no release/version) — clone then checkout the ref, so
    # a source build is reproducible instead of `--depth 1` latest-HEAD.
    ref: 6bfa47197d78e68b79041d494e280174cb2d6ae1
    repo: blechschmidt/massdns
    runtime: source
    install: 'mkdir -p ~/.local/bin/.stage && rm -rf /tmp/_massdns && git clone -q https://github.com/blechschmidt/massdns /tmp/_massdns && git -C /tmp/_massdns checkout -q {ref} && make -C /tmp/_massdns >/dev/null && cp /tmp/_massdns/bin/{bin} ~/.local/bin/.stage/{bin} && rm -rf /tmp/_massdns'
    version_cmd: massdns --help
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/blechschmidt/massdns
    deps: [build-essential, git]   # gcc + make to compile
    notes: Built from source (gcc+make) at a pinned commit; installed to ~/.local/bin. puredns needs it at runtime.

  - bin: jxscout-chunks
    maintenance_state: frozen
    phase: crawl
    role: lazy-CHUNK candidate discovery from an already-downloaded JS bundle (webpack/vite loaders)
    # The upstream project is a Burp/Caido-style intercepting proxy with its own SQLite event bus that
    # FETCHES what it finds. We use none of that: the piece with value is one embedded script, invoked
    # `<file> <bruteForceLimit>` -> candidate paths on stdout. Quarry keeps ownership of resolution,
    # scope, rate, fetching, evidence and resume — a producer, never a crawler.
    #
    # Installed from PINNED SOURCE rather than `go install`: the Go binary is scaffolding for a workflow
    # Quarry does not have (it would build ~30 MB to give us none of it), and the tree carries COPYING
    # plus its dependency notices, which a cherry-picked build artifact would strip. GPL-3.0 upstream:
    # Quarry distributes nothing and invokes it as a separate program (see docs/design/JXSCOUT.md).
    #
    # ARCHIVED upstream (2026-04-12) — `frozen` is not a policy choice here, it is the fact: no release
    # will ever move this pin, so `quarry lock --refresh` has nothing to check for this entry.
    ref: 3a1018a694fd630137b1c19525abcb47315404d4
    repo: francisconeves97/jxscout
    runtime: source
    # clone at the exact ref -> VERIFY the engine's own sha256 -> stage a shim that runs it under node.
    # The GPL file is never modified: the shim is ours, the tree stays whole beside it.
    install: 'set -e; rm -rf /tmp/_jxscout; git clone -q https://github.com/francisconeves97/jxscout /tmp/_jxscout && git -C /tmp/_jxscout checkout -q {ref} && echo "157118f58497a8f1208e80bb24f58aa1b25e3847898d07a414cd473a6d0f6f81  /tmp/_jxscout/internal/modules/chunk-discoverer/chunk-discoverer.js" | sha256sum -c - >/dev/null && mkdir -p ~/.local/share/quarry && rm -rf ~/.local/share/quarry/jxscout && mv /tmp/_jxscout ~/.local/share/quarry/jxscout && rm -rf ~/.local/share/quarry/jxscout/.git && cp ~/.local/share/quarry/jxscout/internal/modules/chunk-discoverer/chunk-discoverer.js ~/.local/share/quarry/jxscout-chunk-discoverer.cjs && mkdir -p ~/.local/bin/.stage && printf ''#!/bin/sh\nexec node "$HOME/.local/share/quarry/jxscout-chunk-discoverer.cjs" "$@"\n'' > ~/.local/bin/.stage/{bin} && chmod +x ~/.local/bin/.stage/{bin}'
    # The engine is CommonJS while the tree's package.json declares `"type": "module"` for its own build,
    # so node refuses it IN PLACE. The byte-identical `.cjs` copy beside the tree is what makes the module
    # system unambiguous — the file's CONTENT is untouched (same sha256 the install just verified), only
    # its name says how to load it. Upstream never hits this: its Go binary extracts the embedded script
    # to ~/.jxscout/extracted/, outside that package.json's scope.
    # The capability probe RUNS THE ENGINE on one of upstream's own fixtures (installed with the tree) and
    # requires exit 0 — proof that node executed it and that it still extracts from a known bundle, not
    # merely that a file exists on PATH. `0` as the limit keeps the probe derived-only, so a health check
    # can never enumerate anything.
    capability: 'jxscout-chunks $HOME/.local/share/quarry/jxscout/pkg/chunk-discoverer/tests/files/2.js 0'
    version_cmd: 'jxscout-chunks $HOME/.local/share/quarry/jxscout/pkg/chunk-discoverer/tests/files/2.js 0'
    cap_codes: [0]
    doc: https://github.com/francisconeves97/jxscout
    deps: [git, nodejs]
    optional: true
    notes: 'MEASURED: needs node only (no Bun, no npm, no native deps) — that holds for THIS script; the
      tree''s ast-analyzer and sourcemaps bundles do need bun/native bindings and are a separate
      evaluation. Default brute-force limit is 0 (derived candidates only): integer enumeration
      manufactures new target requests, so it is an ENGAGEMENT decision, never an --unbound one.'

  - bin: jxscout-ast
    maintenance_state: frozen
    phase: crawl
    role: AST analysis of an already-downloaded JS bundle — DOM sources/sinks and path-like strings
    # The OTHER half of the same pinned tree the chunk engine comes from, and it needs a different
    # runtime: MEASURED, `ast-analyzer.js` runs under BUN and fails under node ("Failed to load native
    # binding" — the bundler stubbed every native require, so the parser can only arrive through
    # NAPI_RS_NATIVE_LIBRARY_PATH). Upstream's own Go code shells out to `bun run` with exactly that
    # variable. There is no npm/bun install: the analyzer bundle and the native parser are both shipped
    # PREBUILT in the tree, and both are sha256-verified here.
    #
    # Quarry does deterministic COLLECTION with this: raw artifact + path observations. It never fetches
    # what the analyzer names, and the interpretation (following `A.listBrands()`, reconstructing
    # `/api/${...}/${id}/logo`) belongs to the v0.4 skill layer — see
    # notes/current/AST-ANALYZER-LANE-DESIGN.md.
    ref: 3a1018a694fd630137b1c19525abcb47315404d4
    repo: francisconeves97/jxscout
    runtime: source
    install: 'set -e; if ! command -v bun >/dev/null; then echo "jxscout-ast needs bun (the analyzer fails under node): install bun first" >&2; exit 1; fi; if [ ! -d ~/.local/share/quarry/jxscout ]; then rm -rf /tmp/_jxscout_ast; git clone -q https://github.com/francisconeves97/jxscout /tmp/_jxscout_ast && git -C /tmp/_jxscout_ast checkout -q {ref} && mkdir -p ~/.local/share/quarry && rm -rf ~/.local/share/quarry/jxscout && mv /tmp/_jxscout_ast ~/.local/share/quarry/jxscout && rm -rf ~/.local/share/quarry/jxscout/.git; fi; printf ''d1531754a223b21f4c49c2eaed2d16dbef552fac4ebbd69b62739c7c6c48ab65  %s/.local/share/quarry/jxscout/internal/modules/ast-analyzer/ast-analyzer.js\n8a8a0259a16112e633ecd54013ac15c00d24a9d54ec566404ce7d5e66e1d3d54  %s/.local/share/quarry/jxscout/internal/modules/ast-analyzer/parser.linux-x64-gnu.node\n'' "$HOME" "$HOME" | sha256sum -c - >/dev/null && mkdir -p ~/.local/bin/.stage && printf ''#!/bin/sh\nA="$HOME/.local/share/quarry/jxscout/internal/modules/ast-analyzer"\nNAPI_RS_NATIVE_LIBRARY_PATH="$A/parser.linux-x64-gnu.node" exec bun run "$A/ast-analyzer.js" "$@"\n'' > ~/.local/bin/.stage/{bin} && chmod +x ~/.local/bin/.stage/{bin}'
    # RUNS the analyzer on upstream's own example file: proof that bun executed it and that the native
    # parser loaded, not merely that a shim exists on PATH.
    capability: 'jxscout-ast $HOME/.local/share/quarry/jxscout/internal/modules/ast-analyzer/example/test.js'
    version_cmd: 'sha256sum $HOME/.local/share/quarry/jxscout/internal/modules/ast-analyzer/ast-analyzer.js'
    cap_codes: [0]
    doc: https://github.com/francisconeves97/jxscout
    deps: [git]
    optional: true
    notes: 'MEASURED on 148 real bundles: needs BUN (not node) + the prebuilt native parser; physical
      memory runs 165-225x the bundle size (a 30 MB bundle peaks at 5.3 GB) and a 27-30 MB bundle takes
      93-102 s, so the lane runs one bundle at a time under a per-bundle cgroup and a 300 s wall. bun is
      NOT installed by this entry: a curl-pipe-shell of a third-party runtime is the operator''s
      decision, not an install script''s.'

  - bin: alterx
    maintenance_state: active
    version: "v0.1.0"
    phase: vertical
    role: subdomain permutation generation (modern dnsgen)
    install: go install github.com/projectdiscovery/alterx/cmd/alterx@latest
    version_cmd: alterx -version
    doc: https://github.com/projectdiscovery/alterx

  - bin: dnsgen
    maintenance_state: frozen
    version: "1.0.4"
    phase: vertical
    role: subdomain permutation generation (classic)
    install: pipx install dnsgen
    # dnsgen (click) has NO version flag, and `-h` is a usage ERROR (exit 2) — `--help` (exit 0) is the smoke
    # test. Version comes from the pipx identity, not a CLI banner.
    capability: dnsgen --help
    doc: https://github.com/AlephNullSK/dnsgen
    runtime: pipx
    optional: true

  - bin: dnsx
    maintenance_state: active
    version: "v1.3.0"
    phase: vertical
    role: fast DNS resolver / PTR / record enrichment
    install: go install github.com/projectdiscovery/dnsx/cmd/dnsx@latest
    version_cmd: dnsx -version
    doc: https://github.com/projectdiscovery/dnsx

  # ── Phase 4: Probing / fingerprint / screenshots / ports ────────────────
  - bin: httpx
    maintenance_state: active
    version: "v1.10.0"
    phase: probe
    role: HTTP probe + fingerprint + cdn tag; json output is source of truth
    install: go install github.com/projectdiscovery/httpx/cmd/httpx@latest
    version_cmd: httpx -version
    doc: https://github.com/projectdiscovery/httpx
    notes: >
      Blank PORTS.HTTP uses the full methodology port set; explicit
      profile ports narrow/override it. Keep <=15 threads / RL<=5 under WAF. On kali,
      if it crashes remove apt python3-httpx shim.

  - bin: cdncheck
    maintenance_state: active
    version: "v1.2.45"
    phase: probe
    role: offline CDN/WAF/cloud IP classifier — gates the naabu SYN prefilter off shared CDN/WAF edge (T0.3)
    install: go install github.com/projectdiscovery/cdncheck/cmd/cdncheck@latest
    version_cmd: cdncheck -version
    doc: https://github.com/projectdiscovery/cdncheck

  - bin: gowitness
    maintenance_state: active
    release: "3.1.1"
    version: "v0.0.0-20260422172756-4f562901bc23"
    phase: probe
    role: screenshots
    install: go install github.com/sensepost/gowitness@latest
    version_cmd: gowitness version
    doc: https://github.com/sensepost/gowitness
    needs_chromium: true     # drives a headless chromium — needs browser + headless libs
    notes: >
      v3 syntax: `gowitness scan file -f <list> --screenshot-path <dir>`.
      --chrome-args removed. Needs chromium + headless libs (installed by stage 1).
      Verify after install: gowitness scan file with one URL -> have-screenshot=true.

  - bin: naabu
    maintenance_state: active
    version: "v2.6.1"
    phase: probe
    role: fast SYN/CONNECT port scan
    install: go install github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
    version_cmd: naabu -version
    doc: https://github.com/projectdiscovery/naabu
    deps: [libpcap-dev]      # CGO build + runtime libpcap for SYN scan
    notes: Needs libpcap. Scan ranges only when CIDR/ASN explicitly in profile.

  - bin: nmap
    maintenance_state: distro
    policy: distro
    phase: probe
    role: service/version detection (-sV) on naabu-found ports; opt-in infra lane (was invoked but unregistered)
    install: sudo apt-get install -y nmap
    version_cmd: nmap --version
    doc: https://nmap.org/book/output-formats-xml-output.html
    optional: true
    notes: Infra lane only (PORTSCAN + CIDR). -oX XML parsed into port(service) entities; IPs grouped by open-port set (no Cartesian).

  # ── Phase 5: Crawl + URL/archive + JS ───────────────────────────────────
  - bin: katana
    maintenance_state: active
    version: "v1.6.1"
    phase: crawl
    role: crawler (standard + headless); batch to avoid OOM
    install: go install github.com/projectdiscovery/katana/cmd/katana@latest
    version_cmd: katana -version
    doc: https://github.com/projectdiscovery/katana
    needs_chromium: true     # -headless / -system-chrome mode
    notes: Headless Chrome is the RAM hog — batch hosts, cap -p/-c. -kf all, -jc.

  - bin: gau
    maintenance_state: monitor
    version: "v2.2.4"
    phase: crawl
    role: passive URL collection (wayback/otx/commoncrawl/urlscan)
    install: go install github.com/lc/gau/v2/cmd/gau@latest
    version_cmd: gau --version
    doc: https://github.com/lc/gau

  - bin: waymore
    maintenance_state: active
    version: "8.9"
    phase: crawl
    role: archive URLs (-mode U) + archived RESPONSES (-mode R) + inline JS (-oijs)
    install: pipx install waymore
    update: pipx upgrade waymore
    version_cmd: waymore -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/xnl-h4ck3r/waymore
    runtime: pipx
    keys: ~/.config/waymore/config.yml (URLScan, VirusTotal keys raise coverage)
    notes: 'Volume bounded by -ci d + -l (LIMITS.WAYMORE_RESPONSES) + timeout. Responses dir feeds xnLinkFinder.'

  - bin: hakrawler
    maintenance_state: monitor
    release: "2.1"
    version: "v0.0.0-20241221204001-76152559a809"
    phase: crawl
    role: fast link spider (secondary to katana)
    install: go install github.com/hakluke/hakrawler@latest
    # hakrawler has NO version/help flag — `-h` is the HEADERS flag (exit 2). It reads URLs from stdin, so the
    # smoke test feeds it EMPTY stdin (exit 0, no network). Version comes from the go-module identity.
    capability: printf '' | hakrawler
    doc: https://github.com/hakluke/hakrawler
    optional: true

  # csprecon removed 2026-07-17 (audit #1/#2): it auto-follows redirects (a public apex can 30x to a
  # private/off-scope host) and can't be run no-follow. Replaced by fetch.scoped_headers (horizontal.csp) —
  # a native, per-hop resolve+scope-guarded CSP fetch that reads the same headers + <meta http-equiv>.

  - bin: smap
    maintenance_state: monitor
    release: "0.2.0"
    version: "v0.0.0-20260413080749-42808b9bbbee"
    phase: probe
    role: passive (Shodan-backed) port scan — stealth, no packets to target
    install: go install github.com/s0md3v/smap/cmd/smap@latest
    version_cmd: smap -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/s0md3v/smap
    optional: true

  - bin: jsluice
    maintenance_state: frozen
    version: "v0.0.0-20240110145140-0ddfab153e06"
    phase: crawl
    role: extract URLs + secrets from JS via tree-sitter
    install: go install github.com/BishopFox/jsluice/cmd/jsluice@latest
    version_cmd: jsluice -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/BishopFox/jsluice

  - bin: xnLinkFinder
    maintenance_state: active
    version: "8.2"
    phase: crawl
    role: links + params + secrets + wordlist from JS dir AND waymore responses (killer combo)
    install: pipx install xnLinkFinder
    update: pipx upgrade xnLinkFinder
    version_cmd: xnLinkFinder -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/xnl-h4ck3r/xnLinkFinder
    runtime: pipx
    deps: [libxml2-dev, libxslt1-dev, zlib1g-dev]   # lxml build
    notes: 'JS dir: -inc -all -mfs 0. Responses dir: add -orig. -sp/-sf = scope files.'

  - bin: js-beautify
    maintenance_state: active
    version: "2.0.3"
    phase: crawl
    role: beautify minified JS for better extraction
    install: pipx install jsbeautifier
    version_cmd: js-beautify --version
    doc: https://github.com/beautifier/js-beautify
    runtime: pipx
    optional: true

  - bin: gitleaks
    maintenance_state: active
    phase: crawl
    role: secret scan on JS dir
    # prebuilt binary — `go install` hits a toolchain/version-constraint conflict on new Go. C08.2b: pinned
    # release + per-platform sha256 artifacts; install downloads the platform artifact, VERIFIES the hash, extracts.
    version: "v8.30.1"
    repo: gitleaks/gitleaks
    runtime: binary
    artifacts:
      linux/amd64: {url: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz",   sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"}
      linux/arm64: {url: "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz", sha256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"}
    install: 'mkdir -p ~/.local/bin/.stage && curl -fsSL {url} -o /tmp/{bin}.tgz && echo "{sha256}  /tmp/{bin}.tgz" | sha256sum -c - && tar -xzf /tmp/{bin}.tgz -C ~/.local/bin/.stage {bin} && chmod +x ~/.local/bin/.stage/{bin} && rm -f /tmp/{bin}.tgz'
    version_cmd: gitleaks version
    doc: https://github.com/gitleaks/gitleaks
    deps: [curl]

  - bin: trufflehog
    maintenance_state: active
    phase: crawl
    role: filesystem secret detection (verification is an opt-in authorized lane; default --no-verification)
    # C08.2b: replaced `curl install.sh | sh` (unpinned, unverified) with a pinned release + sha256-verified download.
    version: "v3.95.9"
    repo: trufflesecurity/trufflehog
    runtime: binary
    artifacts:
      linux/amd64: {url: "https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz", sha256: "f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e"}
      linux/arm64: {url: "https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_arm64.tar.gz", sha256: "9d9c2ec4ea36a089a9c5aaafe1969d176013ddf9f44d68e8cd75291aed8c83ed"}
    install: 'mkdir -p ~/.local/bin/.stage && curl -fsSL {url} -o /tmp/{bin}.tgz && echo "{sha256}  /tmp/{bin}.tgz" | sha256sum -c - && tar -xzf /tmp/{bin}.tgz -C ~/.local/bin/.stage {bin} && chmod +x ~/.local/bin/.stage/{bin} && rm -f /tmp/{bin}.tgz'
    version_cmd: trufflehog --version
    doc: https://github.com/trufflesecurity/trufflehog
    deps: [curl]

  # ── Phase 11: Content discovery (candidate-driven path brute) ───────────
  - bin: ffuf
    maintenance_state: active
    version: "v2.2.1"
    phase: content
    role: candidate-driven path/dir brute over live in-scope hosts (default OFF)
    install: go install github.com/ffuf/ffuf/v2@latest
    version_cmd: ffuf -V
    doc: https://github.com/ffuf/ffuf
    notes: >-
      Content phase only runs when MODES.CONTENT_DISCOVERY != off. Always -ac (autocalibration)
      to kill catch-all/wildcard floods; http_rl -> -rate; optional -recursion. Wordlists live in
      ~/.config/quarry/wordlists/content/ (light ships; balanced/deep fetched by install/update).

  # ── Phase 6/7: Params + lightweight scanning ────────────────────────────
  - bin: gf
    maintenance_state: frozen
    version: "v0.0.0-20200618134122-dcd4c361f9f5"
    phase: params
    role: pattern buckets (sqli/ssrf/redirect/xss/idor...) over URL corpus
    install: go install github.com/tomnomnom/gf@latest
    version_cmd: gf -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/tomnomnom/gf
    notes: Needs ~/.gf patterns (gf-patterns repo). install copies them.
    optional: true

  - bin: arjun
    maintenance_state: monitor
    version: "2.2.7"
    phase: params
    role: param discovery on param-less endpoints
    install: pipx install arjun
    # arjun has NO version flag (`arjun --version` -> argparse rc 2). Its version comes from the pipx
    # identity, not a CLI banner; `arjun -h` (rc 0) is the capability smoke test.
    capability: arjun -h
    doc: https://github.com/s0md3v/Arjun
    runtime: pipx
    notes: Uses -t 5 by default; -d (per-request delay) applied only when RATELIMIT.HTTP is set.

  - bin: nuclei
    maintenance_state: active
    version: "v3.11.0"
    phase: params
    role: non-intrusive template scan; built-in interactsh OOB
    install: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
    update: nuclei -update; nuclei -update-templates
    version_cmd: nuclei -version
    doc: https://github.com/projectdiscovery/nuclei
    needs_chromium: true     # only for -headless / screenshot templates
    notes: >
      Exclude intrusive,fuzz,dos,brute-force. Severity-scope at RL<=5 or it runs
      for days. -stats -si to a logfile (never /dev/null — that hides blocking).

  - bin: dalfox
    maintenance_state: active
    phase: params
    role: reflected-XSS candidate scan (v3 Rust; JSONL output, static AST DOM analysis)
    # v0.3.8: dalfox v2 (go install) -> v3 (Rust rewrite). Distributed as a prebuilt musl-STATIC release binary
    # (no glibc/Rust dep at runtime, cross-distro) with per-platform sha256 artifacts -> C08 `binary` runtime; go
    # install no longer applies. The tarball nests the binary under a versioned dir, so the stage step strips it
    # (--strip-components=1 --wildcards "*/{bin}"). v3 flags + JSONL parse live in params.py (_dalfox_cmd + _parse_dalfox_jsonl).
    # 3.2.0 (2026-08-02). Bumped because the lane now READS the meta row: 3.2.0 emits
    # meta.incomplete / target_summary[] (status + error_code) / total_requests / targets_deduplicated,
    # which is how the lane tells a SKIPPED target from a clean one, plus native --blind-oob for 4.3.D.
    # Both artifact digests were computed from the downloaded bytes, not copied from the sidecar file.
    version: "v3.2.0"
    repo: hahwul/dalfox
    runtime: binary
    artifacts:
      linux/amd64: {url: "https://github.com/hahwul/dalfox/releases/download/v3.2.0/dalfox-v3.2.0-linux-x86_64-musl.tar.gz",  sha256: "4664e8dac304d35f4537655bf9b64ef6c529d47c485ec2610112b3328b3e51f9"}
      linux/arm64: {url: "https://github.com/hahwul/dalfox/releases/download/v3.2.0/dalfox-v3.2.0-linux-aarch64-musl.tar.gz", sha256: "e64e585f9bec69b6f40380c7be57de3b49131560c744f9bc9d71789afb5604a2"}
    install: 'mkdir -p ~/.local/bin/.stage && curl -fsSL {url} -o /tmp/{bin}.tgz && echo "{sha256}  /tmp/{bin}.tgz" | sha256sum -c - && tar -xzf /tmp/{bin}.tgz -C ~/.local/bin/.stage --strip-components=1 --wildcards "*/{bin}" && chmod +x ~/.local/bin/.stage/{bin} && rm -f /tmp/{bin}.tgz'
    version_cmd: dalfox --version
    doc: https://github.com/hahwul/dalfox
    deps: [curl]
    notes: v3 flags + JSONL parse handled in params.py (step 2); RoE rate via global --rate-limit.

  - bin: interactsh-client
    maintenance_state: active
    version: "v1.3.1"
    phase: params
    role: Quarry-owned OOB callback backend (params.oob_probe issues+correlates; quarry oob poll)
    install: go install github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest
    version_cmd: interactsh-client -version
    doc: https://github.com/projectdiscovery/interactsh
    notes: >
      REQUIRED — backs the default-on params.oob_probe source (like dalfox/nuclei back theirs). Default
      backend is interactsh-client's built-in public server; oob.interactsh_server overrides it.

  # ── Phase 8: Continuous monitoring ──────────────────────────────────────
  - bin: gungnir
    maintenance_state: active
    version: "v1.4.0"
    phase: monitor
    role: continuous CT-log monitoring for new certs/subdomains
    install: go install github.com/g0ldencybersec/gungnir/cmd/gungnir@latest
    version_cmd: gungnir -h
    cap_codes: [0, 1]   # help/-h probe: 0 or 1 is a working tool
    doc: https://github.com/g0ldencybersec/gungnir
    optional: true
