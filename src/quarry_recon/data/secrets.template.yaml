# Quarry — secrets (chmod 600). Keys the framework passes to tools itself.
# Tool-native configs stay separate: ~/.config/subfinder/provider-config.yaml,
# ~/.config/waymore/config.yml — put those tools' keys there too.
#
# Any key left blank is simply skipped (that source is recorded as skipped, not silent).
# Tip: back this up before edits ->  cp secrets.yaml secrets.yaml.bak

# GitHub PATs for github-subdomains — use burner accounts to dodge rate limits.
# Add one or more under `github:` as a list (uncomment the examples):
github:
#   - ghp_xxxxxxxxxxxxxxxxxxxx
#   - ghp_yyyyyyyyyyyyyyyyyyyy

# Shodan API key (shosubgo).
shodan:

# Whoxy API key (osint reverse-whois).
whoxy:

# ProjectDiscovery / Chaos (PDCP) key — exported as PDCP_API_KEY for subfinder, asnmap, etc.
projectdiscovery:

# certspotter (SSLMate) API token — extra CT-log subdomain coverage in the vertical phase.
# OPTIONAL: the free tier works with no key (rate-limited); a token raises the limit.
certspotter:

# Out-of-band interaction (optional) — ONE Quarry-owned OOB layer. Quarry manages interactsh-client
# internally: issue token -> callback host/url -> probe -> poll -> correlate to source_tool/target/param.
# NORMAL USE NEEDS NO CONFIG — default backend is interactsh-client's built-in PUBLIC server.
#  - BACKEND OVERRIDE (optional): own private callback infra? set interactsh_server (+ interactsh_token).
#    This REPLACES the backend Quarry uses (and is passed to nuclei when set) — it is NOT a separate
#    channel. Quarry-owned probes (params.oob_probe) then correlate over your server; `quarry oob poll
#    -t <target>` pulls delayed callbacks.
#  - IMPORT (compatibility only, no secret): `quarry oob import <interactsh -json file> -t <target>`
#    ingests EXTERNAL callback logs (Burp Collaborator / XSSHunter / manual interactsh / old dalfox -b).
#    Imported/stray callbacks are evidence but stay UNCORRELATED unless they match a Quarry-issued token.
#  - nuclei keeps its OWN native OAST/correlation (tool-owned); Quarry records its findings, does not
#    re-own its tokens. blind_xss_url below still drives dalfox -b (operator collector; folds in later).
# oob:
#   interactsh_server: https://oob.example.com
#   interactsh_token:  "your-interactsh-auth-token"
#   blind_xss_url:     https://d97prkl….oast.me      # interactsh-client URL / XSSHunter collector → dalfox -b

# Optional run notifications (opt-in, OFF by default). Nothing sends unless you set BOTH an event
# and a channel. Validate with `quarry notify --test`. Webhook URLs / telegram token are redacted
# from logs + manifests.
# notify:
#   events: [complete, error, lead]     # opt in per event (complete · phase/tool error · promising lead)
#   slack:    https://hooks.slack.com/services/XXX/YYY/ZZZ
#   discord:  https://discord.com/api/webhooks/XXX/YYY
#   telegram: {token: "123456:ABC-DEF", chat_id: "987654321"}
#   webhook:  https://your.endpoint/quarry

# ── ADVANCED (leave commented unless you know you want it) ───────────────────────────────────
# openintel-subs paths have MOVED to config.yaml (they're PATHS, not credentials). Set them under
# `openintel:` in ~/.config/quarry/config.yaml. A legacy `openintel:` block here is still read for
# back-compat, but config.yaml is its proper home.

# Censys Platform API — extra PASSIVE cert-transparency subdomain coverage (vertical phase).
# A Personal Access Token + your organization id (platform.censys.io → API/settings). SILENTLY
# skipped unless BOTH `token` and `org` are set — no doctor/install/update noise otherwise. The
# legacy search.censys.io API is being retired; this uses the current Platform API.
# censys:
#   token: censys_pat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   org:   00000000-0000-0000-0000-000000000000

