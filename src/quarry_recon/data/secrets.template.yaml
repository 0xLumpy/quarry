# Quarry — credentials (chmod 600). Reference: README "API keys and webhooks".
# Everything here is optional; leave a value blank to disable that integration.
# Values are stripped from recorded commands, notes, manifests and notifications.
# Back this up before editing:  cp secrets.yaml secrets.yaml.bak

# GitHub PATs for github-subdomains. Use burner accounts.
github:
#   - ghp_xxxxxxxxxxxxxxxxxxxx
#   - ghp_yyyyyyyyyyyyyyyyyyyy

# Shodan API key: shosubgo, favicon and certificate pivots, per-IP host records.
shodan:

# Whoxy API key: `quarry osint` reverse-whois. Charges one credit per page.
whoxy:

# ProjectDiscovery key, exported as PDCP_API_KEY.
projectdiscovery:

# certspotter (SSLMate) token: CT-log subdomains.
certspotter:

# Out-of-band callbacks. The public Interactsh service is used when unset.
# Set your own server to keep callbacks on infrastructure you control.
# oob:
#   callback_server: oob.example.com      # server domain or URL, not a payload host
#   auth_token:                           # only if your server requires auth

# Run notifications. Nothing sends unless both an event and a channel are set.
# notify:
#   events: [complete, error, lead]
#   slack:    https://hooks.slack.com/services/XXX/YYY/ZZZ
#   discord:  https://discord.com/api/webhooks/XXX/YYY
#   telegram: {token: "123456:ABC-DEF", chat_id: "987654321"}
#   webhook:  https://your.endpoint/quarry

# Censys Platform: certificate search. Needs both fields or the source stays silent.
# censys:
#   token: censys_pat_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#   org:   00000000-0000-0000-0000-000000000000

# openintel-subs is a pair of PATHS, not a credential — set it in config.yaml.
# A block here is still read for back-compat.

# Future AI-assisted triage. Not used yet.
# ai:
#   provider:
#   api_key:
