    notes: "SYN web-port prefilter (bbot-style); NOT infra portscan. CDN/WAF edge excluded via offline cdncheck (T0.3, no contact); any-CDN host + zero-open host → direct-httpx (never dropped)"}
  probe.ffuf_vhost:          {tool: ffuf, phase: probe, tier: core, class: active, default: on, bounded: planned,
    input: "base services x apex (live, CDN-detector-negative, active-allowed)", output: review(vhost),
    workers: "settings.workers(ffuf)", rate: http_rl,
    timeout: "per-unit scaled(effective wordlist) -maxtime + hard backstop; lane budget PERFORMANCE.VHOST_BUDGET_S seconds (default 0 = unbounded)",
    failure: "per-unit isolate (not phase BLOCKED)", fallback: skip, parser: internal, log: delta,
    notes: "NO origin cap. `list(best.items())[:25]` was a MEMBERSHIP cap AND origin coverage was fictional
      (only a[0] kept: 74 A-origins -> 47 keys on OTC, 27 dropped before any budget) — and ffuf connects to a
      BASE HOSTNAME, never to the origin key, so DNS chose the address. ffuf 2.1.0-dev has -sni but NO
      address pinning, so membership is what we actually scan: BASE SERVICES x apex. The ADDRESS SET ranks
      them (one co-hosted representative first, then the rest) — order, never membership.
      UNIT IDENTITY = base service (scheme+host+port) + apex; findings are keyed vhost:{base}:{candidate} so
      http://h:80 and https://h:443 stay DISTINCT, and the A set rides along as DNS context only (never as an
      `ip` claim). SCOPE: the effective per-apex wordlist is canonicalized through Quarry's shared IDNA2008 /
      UTS-46 non-transitional policy and filtered to active_allowed, so a malformed or OOS name is never
      CONTACTED (observe/mine OOS evidence, never actively expand against it); that file's digest is bound
      into the resume identity. An apex with no contactable candidate is a clean policy skip. Rows validated
      (int status 100-599, canonical hostname, FUZZ must be in the submitted wordlist). Measures:
      base_services (selection) + base_services_scanned (outcome) + result_rows + state_persisted; excluded
      /invalid candidate counts are POLICY telemetry on the ledger, never omitted coverage."}
