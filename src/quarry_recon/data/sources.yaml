    input: js+sourcemap_dirs, output: secret, workers: n/a, rate: n/a, timeout: http, failure: "ok_codes(0,1); status from report file", fallback: skip, parser: internal, log: delta}
  crawl.trufflehog:          {tool: trufflehog, phase: crawl, tier: core, class: active, default: on,
    input: js+sourcemap_dirs, output: secret, workers: n/a, rate: n/a, timeout: http, failure: quiet-warn, fallback: skip, parser: internal, log: delta}

  # ── enrich (late-host catch-up) ───────────────────────────────────────────────────────
  enrich.a1d_brute:          {tool: puredns, phase: enrich, tier: core, class: active, default: on,
    input: crawl-mined wordlist+apex, output: subdomain(target-wordlist), workers: resolvers, rate: dns_rate, timeout: scaled, failure: quiet-warn, fallback: skip, parser: normalize.hosts, log: delta,
    notes: "A1d recursive re-brute, SCHEDULED: stable buckets, one sweeper per lane, resumable rotation (sweep.run_sweep)"}
  enrich.wildcard_a1d:       {tool: httpx, phase: enrich, tier: core, class: active, default: on,
    input: wildcard_zone, output: subdomain(wildcard-http-a1d), workers: httpx, rate: http_rl, timeout: scaled, failure: quiet-warn, fallback: skip, parser: internal-differ, log: delta,
    notes: "A1d wildcard HTTP differentiation with the crawl-mined vocabulary (same mechanism as vertical.wildcard_http, its OWN lifecycle)"}
  enrich.httpx:              {tool: httpx, phase: enrich, tier: core, class: active, default: on,
    input: late_hosts, output: live+tech, workers: "settings.workers(httpx)", rate: http_rl, timeout: "scaled(hosts×port_weight)", failure: partial-ok, fallback: "(shares probe fingerprint path)", parser: normalize.httpx_json, log: delta}
  enrich.dnsx_resolve:       {tool: dnsx, phase: enrich, tier: core, class: active, default: on,
    input: late_hosts, output: resolved, workers: dnsx, rate: dns_rate, timeout: http, failure: quiet-warn, fallback: skip, parser: normalize.dnsx_resolved, log: delta}
  enrich.dnsx_cname:         {tool: dnsx, phase: enrich, tier: core, class: active, default: on,
    input: late_hosts, output: review(cname/takeover), workers: dnsx, rate: dns_rate, timeout: http, failure: quiet-warn, fallback: skip, parser: internal, log: delta}
  enrich.nuclei_waf:         {tool: nuclei, phase: enrich, tier: core, class: active, default: on,
    input: new_live, output: tech(WAF), workers: "settings.workers(nuclei)", rate: http_rl, timeout: "nuclei_timeout(hosts)", failure: partial-ok, fallback: skip, parser: internal, log: delta}
  enrich.gowitness:          {tool: gowitness, phase: enrich, tier: core, class: active, default: on,
    input: new_live, output: screenshot, workers: fixed, rate: http_rl, timeout: http, failure: reclassify-from-files, fallback: skip, parser: file-count, log: delta}
  enrich.smap:               {tool: smap, phase: enrich, tier: optional, class: passive, default: on, reason: "passive-optional",
    input: new_live, output: port(passive), workers: n/a, rate: n/a, timeout: fixed-600, failure: "reclassify from -oJ (malformed/unreadable → PARTIAL/keep-hard); returned/eligible in note, not forced PARTIAL", fallback: skip, parser: "-oJ JSON, fail-closed schema (shared with probe)", log: one-line}

  # ── origin (correlation, no external tool) ─────────────────────────────────────────────
  origin.correlation:        {tool: internal, phase: origin, tier: core, class: passive, default: on,
    input: "live + certificate stores", output: review(origin-ip), workers: n/a, rate: n/a, timeout: n/a, failure: quiet-warn, fallback: skip, parser: internal, log: delta, notes: "map-only — correlates already-collected cert/live data; sends NO packets to the target",
    notes: "A2 CDN origin-IP correlation; sends NO packets — map-only"}

  # ── content (candidate-driven path discovery; off by default) ──────────────────────────
  content.ffuf:              {tool: ffuf, phase: content, tier: optional, class: active, default: off, reason: "user-intent (content discovery)",
    input: "live services x wordlist (active-allowed)", output: url+review(content),
    workers: "settings.workers(ffuf)", rate: http_rl,
    timeout: "per-service scaled(wordlist x recursion) -maxtime + hard backstop; lane budget PERFORMANCE.CONTENT_FFUF_BUDGET_S seconds (default 0 = unbounded)",
    failure: quiet-warn, fallback: skip, parser: internal, log: delta,
    notes: "off|light|balanced|deep; MATCHES 3xx (ISC-16), no -r. NO host cap (was 25 of 498 on OTC) and NO
      row cap (was 500 — it discarded discovered URLs). Full eligible set,
      CDN-detector-negative-first RANK then host
      round-robin, resumable per-service ledger keyed by a full-sha256 service id and namespaced by the
      coverage-config fingerprint. Completion needs a clean EXECUTION and a usable artifact; any trustworthy
      artifact is retained as digest-bound evidence and replayed. Coverage comes from the CURRENT artifact
      only. Measures: hosts (selection) + hosts_scanned (outcome) + result_rows + state_persisted."}

  # ── params (vuln triage — the 15.6h; the first painful contract batch) ─────────────────
  params.gf:                 {tool: gf, phase: params, tier: core, class: active, default: on,
    input: url_corpus, output: review(vuln-class), workers: n/a, rate: n/a, timeout: n/a, failure: quiet-warn, fallback: skip, parser: internal, log: delta,
    notes: "the review-4992 noise source — needs CANONICALIZATION (host,path,param-set) + digest ranking"}
  params.arjun:              {tool: arjun, phase: params, tier: core, class: active, default: on,
    input: param-less_endpoints, output: url+parameter, workers: "settings.workers(arjun)", rate: http_rl(delay), timeout: http, failure: quiet-warn, fallback: skip, parser: internal, log: delta}
  params.nuclei_scan:        {tool: nuclei, phase: params, tier: heavy, class: active, default: on, bounded: planned,
    input: live, output: finding, workers: "settings.workers(nuclei) + NUCLEI_BULK_SIZE", rate: http_rl, timeout: "nuclei_timeout(hosts)", failure: partial-ok, fallback: "coverage-partial (not empty)", parser: internal, log: delta,
    notes: "OTC: 7h41, ~5.08M requests = CO-TIMEKILLER. DEFAULT-ON (normal recon); FIX by SPEED — scope
      templates, -bs/-c, chunk+state — NOT by gating off. quarry plan MUST declare it a long pole.
      status = EXECUTION (nuclei's own `Scan completed in` line + exit 0 -> chunk done/resumable);
      COVERAGE = separate request counters (measure: requests, per-chunk unit) from nuclei -stats.
      unmeasurable coverage -> coverage:unknown (a GAP), never assumed complete; recorded chunk artifacts
      are sha256-bound, so an edited artifact re-runs instead of being trusted.
      host-error policy: -mhe = PERFORMANCE.NUCLEI_MAX_HOST_ERROR, DEFAULT 0 = -nmhe FULL DEPTH
      (coverage-first; nuclei-native default 30 silently drops erroring hosts — cost 459k requests on OTC),
      folded into the resume work_unit."}
  params.nuclei_takeover:    {tool: nuclei, phase: params, tier: core, class: active, default: on,
    input: cname_subs, output: finding(takeover), workers: "settings.workers(nuclei)", rate: http_rl, timeout: "nuclei_timeout(subs)", failure: partial-ok, fallback: skip, parser: internal, log: delta}
  params.nuclei_oast:        {tool: nuclei, phase: params, tier: core, class: active, default: on,
    input: live, output: finding(oob), workers: "settings.workers(nuclei)", rate: http_rl, timeout: "nuclei_timeout(hosts)", failure: partial-ok, fallback: skip, parser: internal, log: delta,
    notes: "nuclei internal Interactsh OAST; keep as findings (see OOB substrate design)"}
  params.dalfox:             {tool: dalfox, phase: params, tier: heavy, class: active, default: off, retired: "split → dalfox_xss_fast + redirect_confirm",
    input: xss+redirect_candidates, output: finding(xss-candidate), workers: n/a, rate: n/a, timeout: n/a, failure: n/a, fallback: n/a, parser: internal, log: delta,
    notes: "RETIRED. was OTC 7.6h single-core mixed sink = THE timekiller; canonicalize (4.3.A) + split (4.3.B/C) replaced it. Kept for lineage/history."}
  # split targets (declared now; wired in the conversion batch):
  params.dalfox_xss_fast:    {tool: dalfox, phase: params, tier: heavy, class: active, default: on, bounded: planned,
    input: xss_candidates(canonicalized), output: "finding(xss-verified|xss-candidate|dom-xss-static)", workers: "governor (--workers, --max-concurrent-targets)", rate: http_rl, timeout: scaled, failure: partial-ok, fallback: skip, parser: internal, log: delta,
    notes: "WIRED 4.3.B; v3 (Rust) v0.3.8. flags scan -i file -f jsonl -S --skip-mining --workers --max-concurrent-targets --rate-limit; fail-closed JSONL parse, tiered V/R/A (all confirmed:false); chunk+resume; params.blind_xss rides here when MODES.BLIND_XSS arms it"}
  params.redirect_confirm:   {tool: internal, phase: params, tier: core, class: active, default: on,
    input: redirect_candidates, output: finding(open-redirect-candidate), workers: n/a, rate: http_rl, timeout: short, failure: quiet-warn, fallback: skip, parser: internal, log: delta,
    notes: "WIRED 4.3.C. native single-request Location probe (inject canary into redirect param, read Location WITHOUT following); confirmed only when the Location host is the canary; NO dalfox"}
  params.oob_probe:          {tool: interactsh-client, phase: params, tier: core, class: active, default: on,
    input: ssrf_candidates, output: oob_interaction(correlated), workers: n/a, rate: http_rl, timeout: fixed, failure: partial-ok, fallback: skip, parser: internal, log: delta,
    notes: "WIRED P2.3: Quarry-owned interactsh session injects a per-(target,param) callback into SSRF-ish params; a callback correlates back to source/target/param. Skips if interactsh-client missing / passive / no candidates. Delayed callbacks: quarry oob poll (P2.4)"}
  params.blind_xss:          {tool: dalfox, phase: params, tier: optional, class: deep, default: off, reason: "engagement gate (MODES.BLIND_XSS)",
    input: worthy_xss_candidates, output: "oob_interaction (operator-observed until imported)", workers: governor, rate: http_rl, timeout: scaled, failure: partial-ok, fallback: skip, parser: "OOB import", log: one-line,
    notes: "Rides params.dalfox_xss_fast when MODES.BLIND_XSS arms it (--blind-oob). CORRELATION is dalfox's: it mints the per-payload nonce, registers, polls and maps it back; beacons are OPERATOR-OBSERVED until `quarry oob import` records them. The BACKEND is the public interactsh pool unless oob.callback_server names one you host"}

# Non-planned acquisition/control contracts.  These are deliberately separate from
# `sources`: adding them there would change phase planning.  They are nevertheless
# canonical source identities: native calls, subprocesses and event emitters must
# name one of these contracts rather than minting a nearby alias.
# Shared only where the execution semantics are genuinely identical.  YAML
# merges make the complete fourteen-field contract visible on every entry.
auxiliary_defaults:
  target_fetch: &aux_target_fetch
    input: scoped target URL or hostname
    output: retained response+evidence
    workers: n/a
    rate: http_rl
    timeout: http
    failure: quiet-warn
    fallback: skip
    parser: internal
    log: delta
  provider_http: &aux_provider_http
    input: OSINT anchor
    output: candidate+raw-evidence
    workers: n/a
    rate: provider_pace
    timeout: fixed
    failure: quiet-warn
    fallback: skip
    parser: internal
    log: one-line
  external_provider: &aux_external_provider
    input: apex or ASN seed
    output: candidate+raw-evidence
    workers: n/a
    rate: provider_pace
    timeout: fixed
    failure: quiet-warn
    fallback: skip
    parser: internal
    log: one-line
  target_dns: &aux_target_dns
    input: scoped apex hostname
    output: DNS record
    workers: n/a
    rate: dns_rate
    timeout: fixed
    failure: quiet-warn
    fallback: skip
    parser: internal
    log: one-line
  offline_classify: &aux_offline_classify
    input: observed IPs
    output: CDN/WAF classification
    workers: n/a
    rate: n/a
    timeout: scaled
    failure: fail-closed
    fallback: direct-httpx
    parser: strict-jsonl
    log: one-line
  oob_control: &aux_oob_control
    input: OOB session and polling window
    output: callback interaction log
    workers: n/a
    rate: control-plane
    timeout: fixed-window
    failure: quiet-warn
    fallback: skip
    parser: interactsh-json
    log: one-line
  notification: &aux_notification
    input: operator notification payload
    output: delivery receipt
    workers: n/a
    rate: provider_pace
    timeout: fixed
    failure: quiet-warn
    fallback: skip
    parser: internal
    log: one-line
  local_event: &aux_local_event
    input: ownership transition log
    output: coverage state
    workers: n/a
    rate: n/a
    timeout: n/a
    failure: partial-ok
    fallback: retain-state
    parser: internal
    log: one-line

auxiliary_sources:
