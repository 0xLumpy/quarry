# Phase entries predate explicit ownership/transport fields.  Keep their planning
# contracts compact and overlay these canonical semantics at load time.  Each id
# must occur exactly once in each table; sources.py validates this invariant.
semantics:
  ownership:
    quarry_provider: [probe.favicon, probe.cert, probe.shodan_host, vertical.censys, vertical.certspotter, vertical.crtsh, vertical.shosubgo, vertical.github_subs]
    external_tool: [vertical.subfinder, crawl.gau, crawl.waymore_urls, crawl.waymore_responses, horizontal.caduceus, horizontal.asnmap, enrich.smap, probe.smap]
    local: [vertical.openintel, horizontal.kaeferjaeger, horizontal.mapcidr, params.gf, crawl.js_beautify, crawl.jsluice_urls, crawl.jsluice_secrets, crawl.gitleaks, crawl.trufflehog, crawl.xnlinkfinder, origin.correlation, vertical.alterx_permute, crawl.jxscout_chunks, crawl.jxscout_ast]
    target_facing: [content.ffuf, crawl.js_fetch, crawl.katana_headless, crawl.katana_standard, crawl.sourcemaps, dns.dnsx_records, enrich.a1d_brute, enrich.wildcard_a1d, enrich.dnsx_cname, enrich.dnsx_resolve, enrich.gowitness, enrich.httpx, enrich.nuclei_waf, horizontal.cloud_buckets, horizontal.csp, horizontal.revdns, horizontal.tlsx_san, params.arjun, params.blind_xss, params.dalfox, params.dalfox_xss_fast, params.nuclei_oast, params.nuclei_scan, params.nuclei_takeover, params.oob_probe, params.redirect_confirm, probe.ffuf_vhost, probe.gowitness, probe.httpx, probe.naabu_infra, probe.naabu_web, probe.nmap_service, probe.nuclei_waf, probe.tlsx_certs, vertical.puredns_brute, vertical.puredns_resolve, vertical.wildcard_http]
  provider_control: [probe.favicon, probe.cert, probe.shodan_host, vertical.censys, vertical.certspotter, vertical.crtsh, vertical.shosubgo, vertical.github_subs]
  transport:
    - {kind: native-pinned-http, authority: target, profile: native-target-http, sources: [horizontal.csp, crawl.js_fetch, crawl.sourcemaps]}
    - {kind: native-pinned-http, authority: target, profile: native-no-redirect, sources: [params.redirect_confirm, params.oob_probe]}
    - {kind: native-provider-http, authority: public-provider, profile: cloud-bucket-provider, sources: [horizontal.cloud_buckets]}
    - {kind: native-provider-http, authority: public-provider, profile: native-public-provider, sources: [probe.favicon, probe.cert, probe.shodan_host, vertical.censys, vertical.certspotter, vertical.crtsh, vertical.shosubgo]}
    - {kind: external-http, authority: target, profile: target-http-exact, sources: [content.ffuf, probe.ffuf_vhost, probe.httpx, enrich.httpx, vertical.wildcard_http, enrich.wildcard_a1d, params.arjun, params.dalfox_xss_fast]}
    - {kind: external-http, authority: target, profile: target-http-proxy, sources: [crawl.katana_standard, params.blind_xss, params.dalfox]}
    - {kind: external-browser, authority: target, profile: browser-pipe-proxy, sources: [crawl.katana_headless, probe.gowitness, enrich.gowitness]}
    - {kind: external-template-http, authority: target, profile: nuclei-authorized-http, sources: [params.nuclei_oast, params.nuclei_scan, params.nuclei_takeover, probe.nuclei_waf, enrich.nuclei_waf]}
    - {kind: external-dns, authority: target, profile: target-dns, sources: [dns.dnsx_records, enrich.dnsx_cname, enrich.dnsx_resolve, horizontal.revdns, vertical.puredns_brute, vertical.puredns_resolve, enrich.a1d_brute]}
    - {kind: external-tls, authority: target, profile: target-cidr-tls, sources: [horizontal.tlsx_san, horizontal.caduceus]}
    - {kind: external-tls, authority: target, profile: target-tls, sources: [probe.tlsx_certs]}
    - {kind: external-ip, authority: target, profile: target-connect-scan, sources: [probe.naabu_web, probe.naabu_infra]}
    - {kind: external-ip, authority: target, profile: target-connect-service, sources: [probe.nmap_service]}
    - {kind: external-provider, authority: public-provider, profile: public-provider, sources: [vertical.subfinder, horizontal.asnmap, crawl.gau, crawl.waymore_urls, crawl.waymore_responses]}
    - {kind: external-provider, authority: public-provider, profile: github-provider, sources: [vertical.github_subs]}
    - {kind: external-provider, authority: public-provider, profile: shodan-internetdb-provider, sources: [probe.smap, enrich.smap]}
    - {kind: local-corpus, authority: offline, profile: local-internal, sources: [horizontal.kaeferjaeger]}
    - {kind: local-transform, authority: offline, profile: local-internal, sources: [origin.correlation]}
    - {kind: cidr-transform, authority: offline, profile: deny-all, sources: [horizontal.mapcidr]}
    - {kind: offline-corpus, authority: offline, profile: deny-all, sources: [vertical.openintel]}
    - {kind: offline-transform, authority: offline, profile: deny-all, sources: [vertical.alterx_permute, params.gf, crawl.js_beautify, crawl.jsluice_urls, crawl.jsluice_secrets, crawl.xnlinkfinder, crawl.gitleaks, crawl.trufflehog]}
    - {kind: offline-transform, authority: offline, profile: unsupported-systemd-sandbox-escape, sources: [crawl.jxscout_ast]}
    - {kind: offline-transform, authority: offline, profile: offline-bwrap-network-deny, sources: [crawl.jxscout_chunks]}
