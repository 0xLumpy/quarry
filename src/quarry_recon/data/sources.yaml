    notes: "waymore -mode B downloads archived RESPONSES → the xnLinkFinder 'killer combo'. NORMAL crawl
      intelligence — heavy (a plan long-pole) but DEFAULT-ON. bounded by waymore_limit."}
  crawl.js_fetch:            {tool: internal, phase: crawl, tier: core, class: active, default: on,
    input: js_urls, output: "js_files (downloaded, deduped, beautified)", workers: n/a, rate: http_rl, timeout: http, failure: quiet-warn, fallback: skip, parser: none, log: delta,
    notes: "internal JS downloader (scoped_get); ACTIVE-ALLOWED only (eligible counted after gating).
      NO input cap (the old 2000-slice was the cap lottery: influx1 went 433/439 -> 0/439 between runs).
      FULL eligible set, host-round-robin order, throughput budget PERFORMANCE.JS_FETCH_BUDGET_S seconds
      (default 0 = unbounded); remainder is a resumable per-URL ledger (raw/crawl/js_fetch.state.json,
      sha256-bound). TWO measures: js_urls = selection (budget -> cap gap), js_fetched = outcome
      (in-flight loss -> timeout gap). Per-item 15 MB size guard KEPT.
      js_files/ = IMMUTABLE content-addressed raw responses (full sha256; the ledger's evidence, published
      atomically). Miners/scanners read js_derived/, which is STAGED from validated evidence only, beautified
      while staged, then swapped in atomically — exact by construction, and NOT mined at all if it cannot be
      published exactly (measure: js_mineable)."}
  crawl.jxscout_ast:         {tool: jxscout-ast, phase: crawl, tier: optional, class: passive, default: off, reason: "collection-only (MODES.JS_AST); artifacts nothing reads yet",
    input: "downloaded JS bundles", output: "raw analyzer artifact (JSON) per bundle", workers: 1, rate: n/a, timeout: 300s, failure: quiet-warn, fallback: skip, parser: none, log: delta,
    notes: "COLLECT ONCE, INTERPRET LATER (notes/current/AST-ANALYZER-LANE-DESIGN.md). This lane analyses
      each bundle exactly once and publishes the COMPLETE immutable artifact; normalising it into
      observations, and any interpretation of them, is a separate step. It fetches nothing and names no
      entity: what the analyzer emitted is evidence, not a finding.
      Resumable work unit is the BUNDLE (content digest + engine digest + policy), so a re-run skips
      bundles whose artifact already landed. MEASURED: physical memory is 165-225x the bundle size (a
      30 MB bundle peaks at 5.3 GB) and 27-30 MB bundles take 93-102 s, so each invocation gets its own
      cgroup (MemoryMax=max(1 GB, 300x size) up to a ceiling, MemorySwapMax=0) and runs ONE AT A TIME.
      No bwrap or no cgroup -> the lane does not run: it parses attacker-controlled bytes with 1609
      regexes and can take gigabytes doing it. DEFAULT OFF until the observation layer exists."}
  crawl.jxscout_chunks:      {tool: jxscout-chunks, phase: crawl, tier: optional, class: passive, default: on,
    input: "downloaded JS bundles", output: "candidate lazy-chunk URLs -> js_url", workers: n/a, rate: n/a, timeout: 60s, failure: quiet-warn, fallback: skip, parser: stdout-lines, log: delta,
    notes: "PASSIVE by class: the analyzer reads bundles already on disk and contacts nothing — fetching an
      accepted chunk is crawl.js_fetch's job, under its rate and budget. Webpack/vite loaders name chunks
      that nothing links to, so no crawler reaches them. Quarry owns resolution (port AND query preserved —
      the upstream tool's own resolver drops the port), scope, rate, evidence and resume; the tool is a
      candidate producer only. Sandboxed (bwrap: read-only FS, no network) because it EVALUATES the
      bundle's chunk-name function; no sandbox -> the lane does not run. Derived candidates only by
      default: MODES.JS_CHUNK_BRUTE (engagement, default 0) is what allows guessing ids, and no flag can
      lift it. JXSCOUT_ROUNDS bounds traversal depth. An empty result is AMBIGUOUS (the parser is
      error-tolerant, so an unparseable bundle looks exactly like one with no chunks) and is never read as
      proof that a bundle has none."}

